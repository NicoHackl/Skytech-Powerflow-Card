name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # HACS lädt die Datei aus dem Release-Anhang, nicht aus dem Repository —
      # deshalb ist dist/ bewusst nicht eingecheckt.
      - name: An das Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/skytech-power-flow-card.js
          generate_release_notes: true
